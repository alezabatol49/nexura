<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXURA · Ultra-Luxury Winter Wear & Family Garments</title>
    <meta name="description" content="NEXURA — Ultra-luxury winter outerwear & garments in Pakistan. Arctic parkas, puffer jackets, heavyweight hoodies, cashmere sweaters, and family collections." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Netlify Badge Blockers -->
    <style>
      [data-netlify-badge],
      .netlify-badge,
      #netlify-badge,
      iframe[src*="netlify"],
      div[style*="position: fixed"][style*="bottom:"],
      div[style*="z-index: 2147483647"],
      div[class*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>

    <script>
      // Netlify iframe Remover Observer
      const observer = new MutationObserver(() => {
        const badge = document.querySelector('[data-netlify-badge], .netlify-badge, #netlify-badge, iframe[src*="netlify"]');
        if (badge) {
          badge.remove();
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
