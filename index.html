<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Complete SEO Meta Tags -->
    <title>NEXURA · Ultra-Luxury Winter Wear & Family Garments</title>
    <meta name="description" content="NEXURA — Ultra-luxury winter outerwear & garments in Pakistan. Arctic parkas, puffer jackets, heavyweight hoodies, cashmere sweaters, windproof gloves, thermal socks & balaclavas. Cash on Delivery across Pakistan." />
    <meta name="keywords" content="NEXURA, winter garments, arctic parkas, puffer jackets, cashmere sweaters, leather gloves, thermal socks, balaclavas, winter wear pakistan, online clothing store" />
    <link rel="canonical" href="https://nexura-pk.netlify.app/" />

    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexura-pk.netlify.app/" />
    <meta property="og:title" content="NEXURA · Family & Winter Garments" />
    <meta property="og:description" content="Over 1,500+ premium pieces engineered for everyday comfort. Order directly via WhatsApp with Cash on Delivery." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Store Schema for Google SEO & AdSense -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "NEXURA",
      "url": "https://nexura-pk.netlify.app",
      "description": "Ultra-luxury winter outerwear and family garments in Pakistan",
      "priceRange": "PKR 500 - PKR 15000",
      "paymentAccepted": "Cash on Delivery",
      "currenciesAccepted": "PKR",
      "areaServed": "PK"
    }
    </script>

    <!-- Netlify Badge Killer CSS -->
    <style>
      [data-netlify-badge],
      .netlify-badge,
      #netlify-badge,
      iframe[src*="netlify"],
      div[style*="position: fixed"][style*="bottom:"] a[href*="netlify"],
      div[style*="position: fixed"][style*="bottom: 0"][style*="right: 0"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
